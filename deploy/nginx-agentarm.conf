# Insert inside the existing yavuzselim.tech HTTPS server block.
# proxy_pass deliberately has no trailing slash: AgentArm owns the /AgentArm prefix.
location = /folderlens {
    return 308 /folderlens/;
}

# Friendly public URL; an internal rewrite reuses the existing proxy policy.
# The browser keeps /folderlens/ while old share/API URLs remain compatible.
location ^~ /folderlens/ {
    rewrite ^/folderlens/(.*)$ /AgentArm/$1 last;
}

location = /AgentArm {
    return 308 /AgentArm/;
}

# Linux paths are case-sensitive. Accept common mixed-case spellings while
# preserving AgentArm's canonical public path.
location ~* ^/agentarm$ {
    return 308 /AgentArm/;
}
location ~* ^/agentarm/(.*)$ {
    return 308 /AgentArm/$1;
}

location ^~ /AgentArm/ {
    client_max_body_size 470m;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}
