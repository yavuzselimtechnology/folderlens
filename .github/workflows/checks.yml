name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m ruff check agentarm run.py tests
      - run: python -m ruff format --check agentarm run.py tests
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        shell: bash
        run: |
          python -m uvicorn run:app --host 127.0.0.1 --port 5089 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          deadline = time.monotonic() + 30
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:5089/AgentArm/healthz', timeout=1).close()
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.2)
          PY
          npm run test:browser
