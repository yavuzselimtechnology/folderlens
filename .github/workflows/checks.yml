name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Ubuntu restricts user namespaces for downloaded developer builds.
      # Use the installed stable browser without disabling Chromium's sandbox.
      FOLDERLENS_PDF_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify sandboxed PDF renderer
        run: |
          python - <<'PY'
          import tempfile
          from agentarm.pdf_worker import create_pdf
          with tempfile.TemporaryDirectory(prefix="folderlens-renderer-check-") as runtime:
              result = create_pdf({
                  "runtime_dir": runtime,
                  "html": "<!doctype html><html><body><p>Renderer check</p></body></html>",
                  "page_size": "A4",
                  "landscape": False,
              })
              assert result["page_count"] == 1
              assert not result["network_enabled"] and not result["javascript_enabled"]
          PY
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m ruff check agentarm run.py folderlens.py build_agent_release.py tests
      - run: python -m ruff format --check agentarm run.py folderlens.py build_agent_release.py tests
      - run: python build_agent_release.py --commit HEAD --output-dir downloads
      - run: npm ci
      - run: npm test
      - name: Browser smoke test
        shell: bash
        run: |
          python -m uvicorn run:app --host 127.0.0.1 --port 5089 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          deadline = time.monotonic() + 30
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:5089/AgentArm/healthz', timeout=1).close()
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.2)
          PY
          npm run test:browser
